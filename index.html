<style>
:root{
  --bg:#F6F7F6; --panel:#FFFFFF; --side:#FFFFFF; --ink:#16201F; --muted:#66736F;
  --line:#E2E7E5; --accent:#0B8A84; --accent-ink:#FFFFFF; --accent-soft:#DDF1EF; --dot:#D6DDDA;
  --sans:"Figtree", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --side-w:292px; --top-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1413; --panel:#151D1C; --side:#121918; --ink:#E6EFED; --muted:#8FA09B;
    --line:#243230; --accent:#2FC0B6; --accent-ink:#06211F; --accent-soft:#143A38; --dot:#1E2A28;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1413; --panel:#151D1C; --side:#121918; --ink:#E6EFED; --muted:#8FA09B;
  --line:#243230; --accent:#2FC0B6; --accent-ink:#06211F; --accent-soft:#143A38; --dot:#1E2A28;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}

.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100vh}

/* ---------- sidebar ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 16px;border-bottom:1px solid var(--line);text-decoration:none}
.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.brand b{display:block;font-size:1.05rem;font-weight:600}
.brand small{display:block;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.search{margin:14px 14px 6px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;font:inherit;font-size:.92rem;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.nav{flex:1;overflow-y:auto;padding:8px 10px 14px}
.nav-home{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:9px;font-size:.98rem;text-decoration:none}
.nav-home:hover,.item:hover,.cat-btn:hover{background:var(--bg)}
.nav-home.active,.item.active{background:var(--accent-soft)}
.nav-home svg,.item svg{color:var(--muted)}
.nav-home.active svg,.item.active svg{color:var(--accent)}
.nav-label{font-family:var(--mono);font-size:.78rem;color:var(--muted);padding:18px 12px 6px}
.cat{margin-top:2px}
.cat-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;font-size:.96rem;font-weight:500}
.cat-n{font-family:var(--mono);font-size:.74rem;min-width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;color:var(--muted);background:var(--panel)}
.cat-t{flex:1;min-width:0}
.cat-btn .chev{color:var(--muted);transition:transform .15s}
.cat-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.items{margin:2px 0 6px 22px;padding-left:10px;border-left:1px solid var(--line)}
.items[hidden]{display:none}
.item{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:8px;font-size:.92rem;text-decoration:none;line-height:1.3}
.item .dot{width:7px;height:7px;border-radius:50%;background:var(--line);margin-top:6px;flex:none}
.item.active .dot{background:var(--accent)}
.item.active{font-weight:600}
.no-match{padding:10px 12px;color:var(--muted);font-size:.9rem}
.side-foot{border-top:1px solid var(--line);padding:12px 18px;font-family:var(--mono);font-size:.76rem;color:var(--muted)}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1px, transparent 1px);background-size:22px 22px}
.top{height:var(--top-h);flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.crumbs{flex:1;min-width:0;font-family:var(--mono);font-size:.92rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:500}
.crumbs .sl{margin:0 8px;opacity:.6}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:.92rem;font-weight:500;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.menu-btn{display:none;padding:9px 10px}
.view{flex:1;min-height:0;overflow-y:auto}
.view[hidden]{display:none}

/* home */
.home{max-width:1060px;padding:44px 40px 70px}
.home h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0 0 12px}
.home .lead{margin:0;color:var(--muted);font-size:1.08rem;max-width:62ch;line-height:1.6}
.sec{display:flex;align-items:center;gap:10px;margin:38px 0 14px;font-weight:600;font-size:1.02rem}
.sec i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.sec small{font-family:var(--mono);font-weight:400;font-size:.78rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{display:flex;gap:16px;align-items:flex-start;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--panel);text-decoration:none;transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:var(--accent);box-shadow:0 2px 14px rgba(11,138,132,.12)}
.ico{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);color:var(--accent);display:grid;place-items:center;flex:none}
.card h3{margin:0 0 5px;font-size:1.08rem;font-weight:600}
.card p{margin:0;color:var(--muted);font-size:.94rem;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-family:var(--mono);font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.empty{margin-top:34px;padding:26px;border:1px dashed var(--line);border-radius:16px;background:var(--panel);color:var(--muted)}
.empty b{color:var(--ink)}
.empty button{margin-top:10px}
.empty code{font-family:var(--mono);font-size:.88em;background:var(--bg);padding:1px 6px;border-radius:5px}

/* tool view */
#tool-view{display:flex;flex-direction:column;overflow:hidden}
#tool-view[hidden]{display:none}
.tool-bar{flex:none;display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.tool-bar p{margin:0;flex:1;min-width:0;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-bar .btn{padding:6px 11px;font-size:.84rem}
iframe{flex:1;width:100%;border:0;background:var(--bg)}

/* hero */
.kicker{font-family:var(--mono);font-size:.8rem;color:var(--accent);letter-spacing:.05em;text-transform:uppercase;margin:0 0 14px}
.hero .lead{max-width:64ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.cta .btn{padding:11px 18px;font-size:.96rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:30px;max-width:640px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.stat b{display:block;font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat span{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.hero .note{margin:16px 0 0;color:var(--muted);font-size:.9rem}

/* about / case study */
.about{max-width:780px;padding:44px 40px 90px}
.about h1{font-size:clamp(1.8rem,4vw,2.4rem);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px}
.about .lead{margin:0;color:var(--muted);font-size:1.08rem;line-height:1.6}
.about h2{margin:36px 0 10px;font-size:1.15rem;font-weight:600;display:flex;align-items:center;gap:10px}
.about h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.about p,.about li{line-height:1.7;font-size:1.02rem}
.about ol{margin:10px 0 0;padding-left:22px}
.about li{margin:8px 0}
.about li b{font-weight:600}
.about .cta{margin-top:34px}

.scrim{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(var(--side-w),86vw);z-index:20;transform:translateX(-102%);transition:transform .2s}
  body.nav-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
  .menu-btn{display:inline-flex}
  .home{padding:28px 18px 56px}
  .about{padding:28px 18px 64px}
  .top{padding:0 12px}
  .tool-bar p{display:none}
  .btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

      home:"Home", aboutNav:"About the project", tools:"tools", search:"Search a tool", full:"Full page", none:"No results for",

    if (!isEvent) { if (path === lastView) return; lastView = path; }
    try {
      if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({path: path, title: title, event: !!isEvent});
      else if (!isEvent) pendingView = {path: path, title: title};
    } catch(e){}
  }
  if (GC) {
    const s = document.createElement("script");
    s.async = true;
    s.dataset.goatcounter = "https://" + GC + ".goatcounter.com/count";
    s.dataset.goatcounterSettings = '{"no_onload":true}';
    s.src = "//gc.zgo.at/count.js";
    s.onload = () => { if (pendingView) { const v = pendingView; pendingView = null; lastView = ""; track(v.path, v.title); } };
    document.head.appendChild(s);
    try {
      if (localStorage.getItem("hub-seen")) window.addEventListener("load", () => setTimeout(() => track("evt/ritorno", "Visitatore di ritorno", true), 800));
      else localStorage.setItem("hub-seen", "1");
    } catch(e){}
  }

  const ICO = {
    tool:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><rect x="7.5" y="6.5" width="9" height="3.5" rx=".6"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01M16 17.5h.01"/></svg>',
    info:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    home:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4m0 0h12l-2 4 2 4H5"/></svg>',
    chev:'<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
    moon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',
    sun:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
  };

  /* ---------- tema ---------- */
  const root = document.documentElement;
  try { const t = localStorage.getItem("hub-theme"); if (t) root.dataset.theme = t; } catch(e){}
  const theme = () => root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  function syncFrame(){
    try { $("frame").contentDocument.documentElement.setAttribute("data-theme", theme()); } catch(e){}
  }
  function paintThemeBtn(){
    const dark = theme() === "dark";
    $("theme-btn").innerHTML = (dark ? ICO.sun : ICO.moon) + '<span class="lbl">' + (dark ? "Light" : "Dark") + '</span>';
  }
  $("theme-btn").addEventListener("click", () => {
    const next = theme() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("hub-theme", next); } catch(e){}
    paintThemeBtn(); syncFrame();
  });
  $("frame").addEventListener("load", () => {
    syncFrame();
    // evento "ha usato lo strumento": una sola volta per apertura, solo se le statistiche sono attive
    if (!GC) return;
    try {
      const id = $("frame").dataset.id;
      $("frame").contentDocument.addEventListener("input", function f(e){
        e.currentTarget.removeEventListener("input", f, true);
        track("evt/uso/" + id, "Ha modificato un input: " + id, true);
      }, true);
    } catch(e){}
  });

  /* ---------- ricerca e stato ---------- */
  let query = "";
  const open = new Set(cats.map(c => c.id));
  const match = t => {
    if (!query) return true;
    const hay = (t.name + " " + t.description + " " + (t.tags || []).join(" ") + " " + catName(t.category)).toLowerCase();
    return query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  };
  const groups = () => {
    const ids = cats.map(c => c.id);
    tools.forEach(t => { if (!ids.includes(t.category)) ids.push(t.category); });
    return ids.map(id => ({id, name: catName(id), tools: tools.filter(t => t.category === id && match(t))}))
              .filter(g => g.tools.length);
  };
  let activeId = null, isAbout = false;

  /* ---------- sidebar ---------- */
  function renderNav(){
    const gs = groups();
    let h = '<a class="nav-home' + (!activeId && !isAbout ? ' active' : '') + '" href="#/">' + ICO.home + '<span>' + esc(L().home) + '</span></a>';
    h += '<a class="nav-home' + (isAbout ? ' active' : '') + '" href="#/about">' + ICO.info + '<span>' + esc(L().aboutNav) + '</span></a>';
    h += '<div class="nav-label">' + esc(L().tools) + ' · ' + tools.length + '</div>';
    if (!gs.length) h += '<div class="no-match">' + esc(L().none) + ' “' + esc(query) + '”.</div>';
    gs.forEach(g => {
      const isOpen = query ? true : open.has(g.id);
      h += '<div class="cat"><button class="cat-btn" data-cat="' + esc(g.id) + '" aria-expanded="' + isOpen + '">' +
           '<span class="cat-n">' + g.tools.length + '</span><span class="cat-t">' + esc(g.name) + '</span>' + ICO.chev + '</button>' +
           '<div class="items"' + (isOpen ? '' : ' hidden') + '>' +
           g.tools.map(t => '<a class="item' + (t.id === activeId ? ' active' : '') + '" href="#/t/' + encodeURIComponent(t.id) + '"><span class="dot"></span><span>' + esc(t.name) + '</span></a>').join("") +
           '</div></div>';
    });
    $("nav").innerHTML = h;
    const u = L().unit, nc = new Set(tools.map(t => t.category)).size;
    $("side-foot").innerHTML = esc(plural(tools.length, u[0], u[1]) + " · " + plural(nc, u[2], u[3])) +
      (HUB.repo ? ' · <a href="' + esc(HUB.repo) + '" target="_blank" rel="noopener">GitHub</a>' : '');
  }
  $("nav").addEventListener("click", e => {
    const b = e.target.closest(".cat-btn");
    if (b) {
      const id = b.dataset.cat;
      open.has(id) ? open.delete(id) : open.add(id);
      renderNav();
    }
  });
  $("q").addEventListener("input", e => { query = e.target.value.trim(); renderNav(); if (!activeId) { if (isAbout) location.hash = "#/"; else renderHome(); } });

  /* ---------- home ---------- */
  function cardHtml(t){
    return '<a class="card" href="#/t/' + encodeURIComponent(t.id) + '"><span class="ico">' + ICO.tool + '</span><span><h3>' + esc(t.name) + '</h3><p>' + esc(t.description || "") + '</p>' +
      ((t.tags && t.tags.length) ? '<span class="tags">' + t.tags.map(x => '<span class="tag">' + esc(x) + '</span>').join("") + '</span>' : '') +
      '</span></a>';
  }
  function heroHtml(){
    const l = L(), feat = tools.filter(t => t.featured), sim = tools.filter(t => t.simulation).length;
    const stat = (n, lab) => '<div class="stat"><b>' + n + '</b><span>' + esc(lab) + '</span></div>';
    let h = '<div class="hero"><p class="kicker">' + esc(l.kicker) + '</p><h1>' + esc(l.title) + '</h1><p class="lead">' + esc(l.lead) + '</p>' +
      '<div class="cta"><a class="btn primary" href="#' + (feat[0] ? '/t/' + encodeURIComponent(feat[0].id) : '/') + '">' + esc(l.tryIt) + '</a>' +
      '<a class="btn" href="#/about">' + esc(l.caseBtn) + '</a>' +
      (HUB.repo ? '<a class="btn" href="' + esc(HUB.repo) + '" target="_blank" rel="noopener">' + esc(l.codeBtn) + '</a>' : '') + '</div>' +
      '<div class="stats">' + stat(tools.length, l.stTools) + stat(new Set(tools.map(t => t.category)).size, l.stCats) + (sim ? stat(sim, l.stSim) : '') + '</div>' +
      '<p class="note">' + esc(fill(l.note)) + '</p></div>';
    if (feat.length) h += '<div class="sec"><i></i>' + esc(l.start) + '</div><div class="cards">' + feat.map(cardHtml).join("") + '</div>';
    return h;
  }
  function renderAbout(){
    const l = L(), a = l.ab, au = HUB.author || {};
    let h = '<article class="about"><p class="kicker">' + esc(l.kicker) + '</p><h1>' + esc(a.h1) + '</h1><p class="lead">' + esc(a.sub) + '</p>';
    a.s.forEach(s => {
      h += '<h2>' + esc(s.h) + '</h2>';
      (s.p || []).forEach(p => { h += '<p>' + esc(fill(p)) + '</p>'; });
      if (s.ol) h += '<ol>' + s.ol.map(x => {
        const parts = fill(x).split("|");
        return '<li>' + (parts.length > 1 ? '<b>' + esc(parts[0]) + '</b> ' + esc(parts[1]) : esc(parts[0])) + '</li>';
      }).join("") + '</ol>';
    });
    h += '<h2>' + esc(l.by) + ' ' + esc(au.name || "") + '</h2><div class="cta" style="margin-top:12px">' +
      (au.linkedin ? '<a class="btn primary" href="' + esc(au.linkedin) + '" target="_blank" rel="noopener">' + esc(l.linkedin) + '</a>' : '') +
      (au.github ? '<a class="btn" href="' + esc(au.github) + '" target="_blank" rel="noopener">' + esc(l.github) + '</a>' : '') +
      (HUB.repo ? '<a class="btn" href="' + esc(HUB.repo) + '" target="_blank" rel="noopener">' + esc(l.codeBtn) + '</a>' : '') +
      '<a class="btn" href="#/">' + esc(l.tryIt) + '</a></div></article>';
    $("about-view").innerHTML = h;
  }
  function renderHome(){
    const gs = groups();
    let h = '<div class="home">' + (query ? '<h1>' + esc(HUB.title) + '</h1>' : heroHtml());
    if (!query && tools.length) h += '<div class="sec"><i></i>' + esc(L().all) + ' <small>' + tools.length + '</small></div>';
    if (!tools.length) {
      h += '<div class="empty"><b>Non ci sono ancora strumenti.</b><br>Carica un file HTML nella cartella <code>tools/</code> e aggiungi una riga in <code>tools.js</code>: comparirà qui.</div>';
    } else if (!gs.length) {
      h += '<div class="empty"><b>Nessuno strumento corrisponde a “' + esc(query) + '”.</b><br><button class="btn" id="clear-q">Svuota la ricerca</button></div>';
    } else {
      gs.forEach(g => {
        h += '<div class="sec"><i></i>' + esc(g.name) + ' <small>' + g.tools.length + '</small></div><div class="cards">' +
          g.tools.map(cardHtml).join("") + '</div>';
      });
    }
    h += '</div>';
    $("home-view").innerHTML = h;
    const c = $("clear-q"); if (c) c.addEventListener("click", () => { $("q").value = ""; query = ""; renderNav(); renderHome(); $("q").focus(); });
  }

  /* ---------- routing ---------- */
  function crumbs(parts){
    $("crumbs").innerHTML = parts.map((p, i) => p.href ? '<a href="' + p.href + '">' + esc(p.t) + '</a>' : '<b>' + esc(p.t) + '</b>').join('<span class="sl">/</span>');
  }
  function route(){
    const m = location.hash.match(/^#\/t\/(.+)$/);
    const tool = m && tools.find(t => t.id === decodeURIComponent(m[1]));
    document.body.classList.remove("nav-open");
    if (tool) {
      activeId = tool.id; isAbout = false;
      open.add(tool.category);
      $("home-view").hidden = true; $("about-view").hidden = true; $("tool-view").hidden = false;
      crumbs([{t:"hub", href:"#/"}, {t:catName(tool.category)}, {t:tool.name}]);
      $("tool-desc").textContent = tool.description || "";
      const src = "tools/" + tool.file;
      $("tool-full").href = src;
      const f = $("frame");
      if (f.dataset.id !== tool.id) { f.dataset.id = tool.id; f.src = src; } else { syncFrame(); }
      document.title = tool.name + " · " + HUB.title;
      track("/t/" + tool.id, tool.name);
    } else if (location.hash === "#/about") {
      activeId = null; isAbout = true;
      $("tool-view").hidden = true; $("home-view").hidden = true; $("about-view").hidden = false;
      crumbs([{t:"hub", href:"#/"}, {t:L().aboutNav}]);
      renderAbout();
      $("about-view").scrollTop = 0;
      document.title = L().ab.h1 + " · " + HUB.title;
      track("/about", "About");
    } else {
      activeId = null; isAbout = false;
      $("tool-view").hidden = true; $("about-view").hidden = true; $("home-view").hidden = false;
      crumbs([{t:"hub", href:"#/"}, {t:"home"}]);
      renderHome();
      document.title = HUB.title + " · " + L().docTitle;
      track("/", "Home");
    }
    renderNav();
  }
  window.addEventListener("hashchange", route);

  /* ---------- lingua ---------- */
  function applyLang(){
    document.documentElement.lang = lang;
    $("q").placeholder = L().search; $("q").setAttribute("aria-label", L().search);
    $("lang-btn").textContent = lang === "en" ? "IT" : "EN";
    const fl = $("tool-full").querySelector(".lbl"); if (fl) fl.textContent = L().full;
  }
  $("lang-btn").addEventListener("click", () => {
    lang = lang === "en" ? "it" : "en";
    try { localStorage.setItem("hub-lang", lang); } catch(e){}
    applyLang(); route();
  });

  /* ---------- menu mobile ---------- */
  $("menu-btn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
  $("scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));

  /* ---------- avvio ---------- */
  $("brand-title").textContent = HUB.title;
  $("brand-sub").textContent = HUB.subtitle || "";
  $("logo").textContent = (HUB.title || "H").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  paintThemeBtn();
  applyLang();
  route();
})();
